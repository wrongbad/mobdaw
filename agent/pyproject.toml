[project]
name = "badmidi"
version = "0.1.0"
description = "Music as code: motifs as values, transformations as functions, text views, MIDI out."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
audio = ["numpy", "scipy", "soundfile"]

[project.scripts]
badmidi = "badmidi.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["badmidi", "badmidi.audio"]
