[workspace]
resolver = "2"
members = ["crates/dsp", "crates/engine"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Applies to the wasm build and (harmlessly) to native builds.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# No unwinding machinery in the wasm: a panic traps. The engine must never panic on the audio thread anyway.
panic = "abort"
